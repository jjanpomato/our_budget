<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짠토의 플래너 - 수입 관리</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --border-color: #e9ecef;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .planner-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .form-section {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label.title {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #495057;
        }
        input[type="date"], 
        input[type="number"], 
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        /* 다중 선택 체크박스 스타일 */
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        button.submit-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button.submit-btn:hover {
            background-color: #fa5252;
        }

        /* 내역 리스트 스타일 */
        .list-section {
            padding: 0 25px 25px 25px;
        }
        .list-section h3 {
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .record-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .record-date {
            font-size: 12px;
            color: #868e96;
        }
        .record-category {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
        }
        .record-memo {
            font-size: 14px;
            color: #343a40;
        }
        .record-amount {
            font-weight: 700;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="planner-container">
    <div class="header">
        <h1>🍅 짠토의 플래너</h1>
        <p style="margin: 5px 0 0 0; font-size: 14px; opacity: 0.9;">수입 및 보너스 기록</p>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label class="title" for="date">날짜</label>
            <input type="date" id="date" required>
        </div>

        <!-- 수정된 다중 선택 영역 -->
        <div class="form-group">
            <label class="title">수입 분류 (중복 선택 가능)</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="income_type" value="월급"> 월급
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="income_type" value="주간달성 보너스"> 주간달성 보너스
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="income_type" value="기타수입"> 기타수입
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="title" for="amount">금액 (원)</label>
            <input type="number" id="amount" placeholder="예: 50000" required>
        </div>

        <div class="form-group">
            <label class="title" for="memo">메모</label>
            <input type="text" id="memo" placeholder="상세 내용을 적어주세요 (선택)">
        </div>

        <button class="submit-btn" id="save-btn">기록하기</button>
    </div>

    <div class="list-section">
        <h3>최근 기록 내역</h3>
        <div id="record-list">
            <!-- 기록된 내역이 여기에 추가됩니다 -->
        </div>
    </div>
</div>

<script>
    // 1. 날짜 기본값 세팅
    document.getElementById('date').valueAsDate = new Date();

    // 2. 초기 데이터 로드 (localStorage 활용)
    let records = JSON.parse(localStorage.getItem('jjanto_records')) || [];
    renderRecords();

    // 3. 저장 버튼 클릭 이벤트
    document.getElementById('save-btn').addEventListener('click', function() {
        const date = document.getElementById('date').value;
        const amount = document.getElementById('amount').value;
        const memo = document.getElementById('memo').value;

        // 다중 체크박스 값 수집
        const checkedNodes = document.querySelectorAll('input[name="income_type"]:checked');
        const selectedIncomes = Array.from(checkedNodes).map(node => node.value);
        
        // 유효성 검사
        if (!date || !amount) {
            alert("날짜와 금액을 정확히 입력해주세요.");
            return;
        }
        if (selectedIncomes.length === 0) {
            alert("수입 분류를 최소 하나 이상 선택해주세요.");
            return;
        }

        // 배열을 쉼표 문자열로 변환 (예: "월급, 주간달성 보너스")
        const incomeString = selectedIncomes.join(', ');

        // 새 데이터 객체 생성
        const newRecord = {
            id: Date.now(),
            date: date,
            category: incomeString,
            amount: Number(amount),
            memo: memo
        };

        // 데이터 저장 및 렌더링
        records.unshift(newRecord); // 최신 항목을 맨 위로
        localStorage.setItem('jjanto_records', JSON.stringify(records));
        renderRecords();

        // 폼 초기화
        document.getElementById('amount').value = '';
        document.getElementById('memo').value = '';
        checkedNodes.forEach(node => node.checked = false);
    });

    // 4. 리스트 화면 출력 함수
    function renderRecords() {
        const listContainer = document.getElementById('record-list');
        listContainer.innerHTML = '';

        if (records.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#adb5bd; font-size:14px;">아직 기록된 내역이 없습니다.</p>';
            return;
        }

        // 최근 5개만 출력
        const displayRecords = records.slice(0, 5);

        displayRecords.forEach(record => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'record-item';
            itemDiv.innerHTML = `
                <div class="record-info">
                    <span class="record-date">${record.date}</span>
                    <span class="record-category">[${record.category}]</span>
                    <span class="record-memo">${record.memo || '메모 없음'}</span>
                </div>
                <div class="record-amount">+${record.amount.toLocaleString()}원</div>
            `;
            listContainer.appendChild(itemDiv);
        });
    }
</script>

</body>
</html>
